[workspace]
name = "rsocial-kobuki"
version = "0.1.0"
description = "ROS 2 Jazzy workspace for rsocial with the Kobuki Gazebo simulator"
channels = ["robostack-jazzy", "conda-forge"]
platforms = ["linux-64"]
channel-priority = "strict"

[dependencies]
python = "3.12.*"
pip = "*"
setuptools = "<80"
wheel = "*"
uv = "*"
colcon-common-extensions = "*"
vcstool = "*"
catkin_pkg = "*"
empy = "*"
lark = "*"
numpy = "<2"
portaudio = "*"
libusb = "*"
libftdi = "*"
libuvc = "*"
sophus = "==22.10"
libboost-devel = "1.90.*"

# Base ROS 2 and workspace dependencies.
ros-jazzy-desktop = "*"
ros-jazzy-ros-base = "*"
ros-jazzy-ament-cmake-clang-format = "*"
ros-jazzy-ament-cmake-python = "*"
ros-jazzy-ament-cmake-ros = "*"
pkg-config = "*"
compilers = "*"
ros-jazzy-ament-index-cpp = "*"
ros-jazzy-ament-lint-auto = "*"
make = "*"
ninja = "*"
ros-jazzy-ros2cli = "*"
cmake = "<4"

ros-jazzy-camera-info-manager = "*"
ros-jazzy-cv-bridge = "*"
ros-jazzy-depth-image-proc = "*"
ros-jazzy-diagnostic-updater = "*"
ros-jazzy-depthai = "*"
ros-jazzy-vision-msgs = "*"
ros-jazzy-image-transport = "*"
ros-jazzy-ffmpeg-image-transport-msgs = "*"
ros-jazzy-launch-xml = "*"
ros-jazzy-message-filters = "*"
pytest = "*"
ros-jazzy-action-msgs = "*"
ros-jazzy-ament-cmake = "*"
ros-jazzy-ament-copyright = "*"
ros-jazzy-rclcpp = "*"
ros-jazzy-rclcpp-action = "*"
ros-jazzy-rclcpp-components = "*"
ros-jazzy-ament-flake8 = "*"
ros-jazzy-robot-state-publisher = "*"
ros-jazzy-ament-lint-common = "*"
ros-jazzy-rosidl-generator-py = "*"
ros-jazzy-ament-mypy = "*"
ros-jazzy-ament-pep257 = "*"
ros-jazzy-ament-xmllint = "*"
ros-jazzy-builtin-interfaces = "*"
ros-jazzy-geometry-msgs = "*"
ros-jazzy-launch-ros = "*"
ros-jazzy-nav-msgs = "*"
ros-jazzy-tf2-ros-py = "*"
ros-jazzy-visualization-msgs = "*"
ros-jazzy-xacro = "*"
ros-jazzy-nav2-msgs = "*"
ros-jazzy-py-trees = "*"
ros-jazzy-py-trees-ros = "*"
ros-jazzy-rclpy = "*"
ros-jazzy-rosidl-default-generators = "*"
ros-jazzy-rosidl-default-runtime = "*"
ros-jazzy-sensor-msgs = "*"
ros-jazzy-std-msgs = "*"
ros-jazzy-std-srvs = "*"
ros-jazzy-tf-transformations = "*"
ros-jazzy-tf2-geometry-msgs = "*"
ros-jazzy-tf2-ros = "*"
ros-jazzy-image-publisher = "*"
yaml = "*"  
yaml-cpp = "*"
magic_enum = "*"

# Dependencies used by the Kobuki simulator.
ros-jazzy-ros-gz-sim = "*"
ros-jazzy-navigation2 = "*"
ros-jazzy-nav2-bringup = "*"
ros-jazzy-laser-filters = "*"

[pypi-dependencies]
Pillow = "*"
PyYAML = "*"
requests = "*"
scipy = ">=1.10.0"
numba = ">=0.67.0"
transformers = ">=4.57.0,<5"
openai-whisper = ">=20230314"
sounddevice = ">=0.4.8"
webrtcvad-wheels = ">=2.0.11.post1"
openai = ">=1.32.0"
google-cloud-texttospeech = ">=2.16.0"
torch = ">=2.5.0"
huggingface-hub = ">=0.20.0"

[activation.env]
UV_SYSTEM_SITE_PACKAGES = "1"

[tasks]
prepare-colcon = "mkdir -p ../src/thirdparty/nao_lola/nao_lola && touch ../src/thirdparty/nao_lola/nao_lola/COLCON_IGNORE"
build = "pixi run prepare-colcon && cd .. && colcon build --symlink-install --cmake-args -DBoost_NO_BOOST_CMAKE=ON"
shell = "bash -c 'cd .. && if [[ -f install/setup.bash ]]; then source install/setup.bash; fi && exec bash'"
source-local = "pixi run shell"
test = {cmd = "cd .. && colcon test", description = "Run tests for the workspace"}
clean = {cmd = "cd .. && rm -rf build install log", description = "Clean build artifacts for the workspace"}
