[workspace]
name = "rsocial"
version = "0.1.0"
description = "ROS 2 Jazzy workspace for rsocial"
channels = ["robostack-jazzy", "conda-forge"]
platforms = ["linux-64"]
channel-priority = "strict"

[dependencies]
python = "3.12.*"
pip = "*"
setuptools = "<80"
wheel = "*"
uv = "*"
colcon-common-extensions = "*"
vcstool = "*"
catkin_pkg = "*"
empy = "*"
lark = "*"
numpy = "<2"
portaudio = "*"
libboost-devel = "1.90.*"
# Dependencias de la parte ROS/Robostack
ros-jazzy-desktop = "*"
ros-jazzy-ros-base = "*"
ros-jazzy-ament-cmake-clang-format = "*"
ros-jazzy-ament-cmake-python = "*"
ros-jazzy-ament-cmake-ros = "*"
pkg-config = "*"
compilers = "*"
ros-jazzy-ament-index-cpp = "*"
ros-jazzy-ament-lint-auto = "*"
make = "*"
ninja = "*"
ros-jazzy-ros2cli = "*"
cmake = "<4"

ros-jazzy-camera-info-manager = "*"
ros-jazzy-cv-bridge = "*"
ros-jazzy-depth-image-proc = "*"
ros-jazzy-diagnostic-updater = "*"
ros-jazzy-depthai = "*"
ros-jazzy-vision-msgs = "*"

ros-jazzy-image-transport = "*"

# Workspace dependencies
ros-jazzy-ffmpeg-image-transport-msgs = "*"
ros-jazzy-launch-xml = "*"
ros-jazzy-message-filters = "*"
pytest = "<9"  # launch_testing (Jazzy) is not compatible with pytest 9
ros-jazzy-action-msgs = "*"
ros-jazzy-ament-cmake = "*"
ros-jazzy-ament-copyright = "*"
ros-jazzy-rclcpp = "*"
ros-jazzy-rclcpp-action = "*"
ros-jazzy-rclcpp-components = "*"
ros-jazzy-ament-flake8 = "*"
ros-jazzy-robot-state-publisher = "*"
ros-jazzy-ament-lint-common = "*"
ros-jazzy-rosidl-generator-py = "*"
ros-jazzy-ament-mypy = "*"
ros-jazzy-ament-pep257 = "*"
ros-jazzy-ament-xmllint = "*"
ros-jazzy-builtin-interfaces = "*"
ros-jazzy-geometry-msgs = "*"
ros-jazzy-launch-ros = "*"
ros-jazzy-nav-msgs = "*"
ros-jazzy-tf2-ros-py = "*"
ros-jazzy-visualization-msgs = "*"
ros-jazzy-xacro = "*"
ros-jazzy-nav2-msgs = "*"
ros-jazzy-irobot-create-msgs = "*"  # TurtleBot 4 (Create 3) bumper in the bumpgo examples
# TurtleBot 4: Gazebo simulator, navigation and RViz
ros-jazzy-turtlebot4-simulator = "*"
ros-jazzy-turtlebot4-navigation = "*"
ros-jazzy-turtlebot4-viz = "*"
ros-jazzy-gz-ros2-control = "*"  # Gazebo plugin for the Create 3 diff drive (not pulled by the simulator)
ros-jazzy-py-trees = "*"
ros-jazzy-py-trees-ros = "*"
ros-jazzy-rclpy = "*"
ros-jazzy-rosidl-default-generators = "*"
ros-jazzy-rosidl-default-runtime = "*"
ros-jazzy-sensor-msgs = "*"
ros-jazzy-std-msgs = "*"
ros-jazzy-std-srvs = "*"
ros-jazzy-tf-transformations = "*"
ros-jazzy-tf2-geometry-msgs = "*"
ros-jazzy-tf2-ros = "*"
yaml = "*"
yaml-cpp = "*"

[pypi-dependencies]
# Dependencias Python de simple_hri (yolo_ros gestiona su propio .venv con uv)
Pillow = "*"
PyYAML = "*"
requests = "*"
scipy = ">=1.10.0"
numba = ">=0.67.0"
transformers = ">=4.57.0,<5"
openai-whisper = ">=20230314"
sounddevice = ">=0.4.8"
webrtcvad-wheels = ">=2.0.11.post1"
openai = ">=1.32.0"
google-cloud-texttospeech = ">=2.16.0"
torch = ">=2.5.0"
huggingface-hub = ">=0.20.0"

# Dependencias extra del simulador Kobuki/Gazebo (entorno `kobuki`).
# Uso: pixi install -e kobuki && pixi run -e kobuki build
[feature.kobuki.dependencies]
# Drivers y librerias de kobuki_core/ecl
libusb = "*"
libftdi = "*"
libuvc = "*"
sophus = "==22.10"
magic_enum = "*"
ros-jazzy-image-publisher = "*"
# Simulador y navegacion
ros-jazzy-ros-gz-sim = "*"
ros-jazzy-navigation2 = "*"
ros-jazzy-nav2-bringup = "*"
ros-jazzy-laser-filters = "*"

[environments]
# Mismo solve-group: las dependencias comunes tienen las mismas versiones en ambos
default = { solve-group = "default" }
kobuki = { features = ["kobuki"], solve-group = "default" }

[activation.env]
UV_SYSTEM_SITE_PACKAGES = "true" # in case a thirdparty uses a venv
# Ignore ~/.local/lib/pythonX.Y/site-packages: packages installed with `pip install --user`
# (e.g. old nvidia-* CUDA wheels) would shadow the ones of this environment and break torch
PYTHONNOUSERSITE = "1"
# Gazebo looks for system plugins (e.g. gz_ros2_control, used by the TurtleBot 4 simulator)
# only in this path; the ones installed by pixi live in the environment lib directory
GZ_SIM_SYSTEM_PLUGIN_PATH = "$CONDA_PREFIX/lib"

[activation]
# Keep the fontconfig cache of this environment separate from the host one:
# sharing ~/.cache/fontconfig between different fontconfig versions makes Qt
# apps (Gazebo GUI, rviz2, rqt) segfault at startup. See the script for details.
scripts = ["pixi/activate-fontconfig.sh"]

[tasks]
prepare-colcon = "mkdir -p src/thirdparty/nao_lola/nao_lola && touch src/thirdparty/nao_lola/nao_lola/COLCON_IGNORE"
# Compila tu workspace local
build = {cmd = "colcon build --symlink-install --cmake-args -DBoost_NO_BOOST_CMAKE=ON", depends-on = ["prepare-colcon"]}
# Configura el workspace local compilado
source-local = "bash -c 'source install/setup.bash && exec bash'"
test = {cmd = "colcon test", description = "Run tests for the workspace"}
clean = {cmd = "rm -rf build install log", description = "Clean build artifacts (build, install, log directories)"}

# TurtleBot 4 simulator (Gazebo). Extra launch arguments are appended, e.g. `pixi run sim world:=maze`.
# Fast DDS: with CycloneDDS many of its ~45 processes fail to create their node.
sim = {cmd = "ros2 launch turtlebot4_gz_bringup turtlebot4_gz.launch.py", env = {RMW_IMPLEMENTATION = "rmw_fastrtps_cpp"}, description = "TurtleBot 4 simulator"}
# Laptops with hybrid graphics: render on the NVIDIA GPU (on some integrated GPUs the simulated lidar returns only its minimum range)
sim-nvidia = {cmd = "ros2 launch turtlebot4_gz_bringup turtlebot4_gz.launch.py", env = {RMW_IMPLEMENTATION = "rmw_fastrtps_cpp", __NV_PRIME_RENDER_OFFLOAD = "1", __GLX_VENDOR_LIBRARY_NAME = "nvidia", __EGL_VENDOR_LIBRARY_FILENAMES = "/usr/share/glvnd/egl_vendor.d/10_nvidia.json"}, description = "TurtleBot 4 simulator on the NVIDIA GPU"}
# Any computer: software rendering on the CPU. Slower, but the simulated lidar always works
sim-generic = {cmd = "ros2 launch turtlebot4_gz_bringup turtlebot4_gz.launch.py", env = {RMW_IMPLEMENTATION = "rmw_fastrtps_cpp", LIBGL_ALWAYS_SOFTWARE = "1"}, description = "TurtleBot 4 simulator with software rendering"}

# `install/setup.bash` is created only after the first build. Source it
# explicitly with `pixi run source-local` after building the workspace.
