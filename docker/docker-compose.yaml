# Build and run the rsocial Jazzy image with Docker Compose.
# From the repository root:
#   docker compose -f docker/docker-compose.yaml up -d --build
# Then open http://localhost:6080/ (user and password: ubuntu).
services:
  rsocial-jazzy:
    build:
      context: ..
      dockerfile: docker/jazzy/Dockerfile
    image: rsocial-jazzy
    container_name: rsocial-jazzy
    ports:
      - "6080:6080"
    volumes:
      # Folder shared between the host (docker/shared) and the container (~/shared)
      - ./shared:/home/ubuntu/shared
